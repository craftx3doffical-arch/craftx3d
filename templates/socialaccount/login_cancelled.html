{% extends 'store/base.html' %}
{% block title %}Sign-in Cancelled — CraftX3D{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card" style="text-align:center;">
    <div style="font-size:2.5rem;margin-bottom:12px;">🙅</div>
    <h2 style="font-family:'Playfair Display',Georgia,serif;font-size:1.3rem;font-weight:700;margin-bottom:8px;">Sign-in Cancelled</h2>
    <p style="font-size:0.88rem;color:var(--text-muted);margin-bottom:24px;line-height:1.6;">
      You cancelled the Google sign-in. No problem — you can try again or use email and password instead.
    </p>
    <div style="display:flex;flex-direction:column;gap:12px;">
      <a href="{% url 'store:login' %}" style="display:block;padding:13px;background:var(--charcoal);color:#fff;border-radius:var(--radius-sm);font-weight:700;text-decoration:none;font-size:0.9rem;">← Back to Sign In</a>
      <a href="{% url 'store:register' %}" style="display:block;padding:13px;background:var(--teal);color:#fff;border-radius:var(--radius-sm);font-weight:700;text-decoration:none;font-size:0.9rem;">Create a Free Account</a>
    </div>
  </div>
</div>
{% endblock %}
