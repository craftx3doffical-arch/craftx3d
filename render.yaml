services:
  - type: web
    name: craftix3dstudio
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: ./build.sh
    startCommand: gunicorn craftix3d.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: USE_SQLITE
        value: "False"
      - key: DATABASE_URL
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: STAFF_ADMIN_USERNAME
        sync: false
      - key: STAFF_ADMIN_PASSWORD
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: "CraftX3D <supportcraftx3dstudio@gmail.com>"
      - key: ALLOWED_HOSTS
        value: craftix3dstudio.onrender.com,craftx3dstudio.in,www.craftx3dstudio.in
      - key: CSRF_TRUSTED_ORIGINS
        value: https://craftix3dstudio.onrender.com,https://craftx3dstudio.in,https://www.craftx3dstudio.in
